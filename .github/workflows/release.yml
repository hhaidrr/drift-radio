name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Get version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        fi

    - name: Build
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
        LDFLAGS="-s -w -X main.Version=$VERSION -X main.BuildTime=$BUILD_TIME"
        
        go build -ldflags="$LDFLAGS" -o drift-radio ./cmd/drift-radio
        
        if [[ "${{ matrix.platform }}" == "windows" ]]; then
          mv drift-radio drift-radio.exe
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: drift-radio-${{ matrix.platform }}-${{ matrix.arch }}
        path: drift-radio*

  create-release:
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create release packages
      run: |
        mkdir -p release
        
        # Create tar.gz for Linux/macOS
        for dir in drift-radio-linux-* drift-radio-darwin-*; do
          if [ -d "$dir" ]; then
            cd "$dir"
            for file in drift-radio*; do
              if [ -f "$file" ]; then
                tar -czf "../release/$file.tar.gz" "$file"
                echo "Created $file.tar.gz"
              fi
            done
            cd ..
          fi
        done
        
        # Create zip for Windows
        for dir in drift-radio-windows-*; do
          if [ -d "$dir" ]; then
            cd "$dir"
            for file in drift-radio*.exe; do
              if [ -f "$file" ]; then
                zip "../release/${file%.exe}.zip" "$file"
                echo "Created ${file%.exe}.zip"
              fi
            done
            cd ..
          fi
        done

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}